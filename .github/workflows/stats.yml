name: Profile stats

# Rebuilds assets/stats-*.svg daily from GitHub's own API, so the profile never depends on a third-party stats server.
on:
  schedule:
    - cron: '17 0 * * *' # 05:47 Nepal time
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the regenerated cards
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/stats.mjs --test && node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit cards if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          git diff --cached --quiet || { git commit -m "Update profile stats"; git push; }
